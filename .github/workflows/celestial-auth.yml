name: Celestial authorization checks
on:
  pull_request:
    paths: ['Celestial/supabase/functions/**', 'Celestial/tests/**', '.github/workflows/celestial-auth.yml']
  push:
    branches: [main]
    paths: ['Celestial/supabase/functions/**', 'Celestial/tests/**', '.github/workflows/celestial-auth.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test Celestial/tests/auth.test.mjs
